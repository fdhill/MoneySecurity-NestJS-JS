services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: moneysecurity_nest
    ports:
      - '5432:5432'
    volumes:
      - nest_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d moneysecurity_nest']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nest_pgdata: